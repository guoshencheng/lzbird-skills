<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'none'">
  <title>旅账鸟鸟 · 行程查看指引</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 1080px; height: 300px; background: #fff; }
    body { color: #1b4438; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .card { width: 1080px; height: 300px; padding: 36px 40px; background: #fff; display: grid; grid-template-columns: 752px 216px; gap: 32px; }
    .content { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
    .brand { display: flex; align-items: center; gap: 14px; }
    .logo { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; position: relative; flex: none; }
    .logo img { position: absolute; width: 99px; height: 99px; left: -27.5px; top: -27.5px; }
    h1, p { margin: 0; }
    h1 { font-size: 28px; line-height: 35px; font-weight: 700; }
    .brand-copy { display: flex; align-items: baseline; gap: 16px; }
    .brand-copy p { font-size: 18px; color: #789184; }
    .code-row { display: flex; align-items: center; gap: 18px; margin-top: 14px; }
    .code-label { color: #728b7e; font-size: 20px; white-space: nowrap; }
    .code { padding: 5px 16px 7px; color: #165c44; background: #f1f7ef; border: 1px solid #dbe7d8; border-radius: 12px; font: 700 48px/1.15 ui-monospace, "SFMono-Regular", Menlo, monospace; letter-spacing: 3px; white-space: nowrap; }
    .instruction { margin-top: 12px; font-size: 22px; line-height: 32px; color: #4f7361; }
    .warning { margin-top: 8px; font-size: 18px; line-height: 26px; color: #927144; }
    .warning:empty { display: none; }
    .qr { display: flex; align-items: center; justify-content: center; }
    .qr img { display: block; width: 216px; height: 216px; object-fit: contain; }
  </style>
</head>
<body>
  <main class="card">
    <section class="content">
      <div class="brand">
        <div class="logo"><img src="{{QR_DATA_URL}}" alt="现有鸟Logo"></div>
        <div class="brand-copy"><h1>旅账鸟鸟</h1><p>微信小程序</p></div>
      </div>
      <div class="code-row"><span class="code-label">行程码</span><div class="code">{{SHORT_CODE}}</div></div>
      <p class="instruction">微信扫码，进入首页后输入行程码查看</p>
      <p class="warning">{{WARNING}}</p>
    </section>
    <div class="qr"><img src="{{QR_DATA_URL}}" alt="现有小程序入口码"></div>
  </main>
</body>
</html>
